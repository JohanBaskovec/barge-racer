name: Deploy to Cloudflare

# Runs on every update of main (merged pull request or direct push).
# Tests must pass before anything is uploaded.
on:
  push:
    branches: [main]
  workflow_dispatch: # lets you redeploy from the Actions tab

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of racing an older one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
